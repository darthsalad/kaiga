name: Release

# Push a tag like v0.1.0 to build signed APKs and open a draft GitHub Release with them.
# Check the draft, then publish it by hand.
#
# Repository secrets needed (Settings › Secrets and variables › Actions):
#   KAIGA_KEYSTORE_BASE64   the release keystore, as `base64 -w0 kaiga-release.jks`
#   KAIGA_STORE_PASSWORD    keystore password
#   KAIGA_KEY_ALIAS         key alias
#   KAIGA_KEY_PASSWORD      key password

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Signing secrets are set
        env:
          KEYSTORE: ${{ secrets.KAIGA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::KAIGA_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      - run: bun run tsc
      - run: bun run test --ci
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KAIGA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/kaiga-release.jks"
      # phones and old phones, plus a universal APK; x86 builds are only for emulators
      - name: Build release APKs
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_KAIGA_RELEASE_STORE_FILE: ${{ runner.temp }}/kaiga-release.jks
          ORG_GRADLE_PROJECT_KAIGA_RELEASE_STORE_PASSWORD: ${{ secrets.KAIGA_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KAIGA_RELEASE_KEY_ALIAS: ${{ secrets.KAIGA_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KAIGA_RELEASE_KEY_PASSWORD: ${{ secrets.KAIGA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
      - name: Collect APKs and checksums
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a universal; do
            cp "android/app/build/outputs/apk/release/app-$abi-release.apk" "dist/kaiga-$GITHUB_REF_NAME-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # release notes: this version's section of CHANGELOG.md
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^(## \[|\[[^]]+\]: )/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Kaiga $GITHUB_REF_NAME" --notes-file notes.md
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kaiga-release.jks"
