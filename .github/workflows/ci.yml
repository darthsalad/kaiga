name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run tsc
      - name: Lint
        run: bunx eslint 'src/**/*.{ts,tsx}' App.tsx
      - name: Tests
        run: bun run test --ci

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bun install --frozen-lockfile
      # One ABI keeps CI fast; it still compiles every native module and bundles the JS.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      # Signed with the debug key, so for testing only, not for sharing.
      - uses: actions/upload-artifact@v4
        with:
          name: kaiga-${{ github.sha }}-arm64
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 14
